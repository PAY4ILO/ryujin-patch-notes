name: Discord sync

# Pulls new patch posts from the Discord channel into data.js and archives posts older than 15 days.
# Needs repository secret DISCORD_TOKEN and repository variable DISCORD_CHANNEL_ID.
on:
  schedule:
    - cron: "17 */2 * * *"   # every 2 hours
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: discord-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pull new posts
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ vars.DISCORD_CHANNEL_ID }}
        run: node sync/discord-sync.mjs

      - name: Commit changes
        run: |
          if [ -z "$(git status --porcelain)" ]; then echo "Nothing new"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js sync/state.json archive
          git commit -m "Sync patch notes from Discord"
          git push
