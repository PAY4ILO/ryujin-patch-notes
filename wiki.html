<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ryujin Wiki</title>
<meta name="description" content="Ryujin (Roblox) wiki in Russian and English, built from the official Trello board, with search.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23d93a2b'/><text x='16' y='23' font-size='19' text-anchor='middle' fill='white' font-family='serif'>龍</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top wrap wide">
  <nav class="tabs"><a href="./" data-i18n="navNotes">Патчноуты</a><a href="wiki.html" aria-current="page" data-i18n="navWiki">Вики</a></nav>
  <div class="brand">
    <div>
      <h1>Ryujin <span data-i18n="h1">вики</span></h1>
      <p class="sub" data-i18n="sub"></p>
    </div>
    <div class="controls">
      <div class="seg" role="group" aria-label="Language">
        <button data-lang="ru">RU</button>
        <button data-lang="en">EN</button>
      </div>
      <button class="icon-btn" id="theme" title="Theme">◐</button>
    </div>
  </div>
</header>

<div class="bar">
  <div class="wrap wide">
    <div class="search" id="searchBox">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" autocomplete="off" spellcheck="false">
      <span class="kbd">/</span>
      <button class="clear" id="clear"></button>
    </div>
    <button class="side-btn" id="sideBtn">☰ <span data-i18n="sections"></span></button>
  </div>
</div>

<div class="wrap wide layout">
  <aside class="side" id="side"></aside>
  <main id="view"></main>
</div>
<footer class="wrap wide" data-i18n="footer"></footer>

<script src="data.js"></script>
<script src="wiki/data.js"></script>
<script src="wiki.js"></script>
</body>
</html>
